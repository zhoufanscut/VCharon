[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcharon"
version = "0.1.0"
description = "File-based channels for AI agents, on one machine or across machines over plain SSH"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zhoufanscut" }]
dependencies = []

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/vcharon"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "LICENSE",
  "pyproject.toml",
]
