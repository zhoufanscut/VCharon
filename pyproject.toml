[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcharon"
version = "0.1.0rc2"
description = "File-based channels for AI agents, on one machine or across machines over plain SSH"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "zhoufanscut" }]
keywords = ["ai", "agents", "ssh", "channels", "cli", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
# standard library only: the standalone binary carries nothing else
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.16.10,<0.17"]
# the standalone binary: pyinstaller vcharon.spec. Pinned: vcharon.spec was checked against
# this version's collect_data_files and collect_submodules, and the one-file bootloader's
# behaviour under a running watcher was measured with it (DESIGN, "Running watchers").
build = ["pyinstaller==6.22.3"]

[project.scripts]
vcharon = "vcharon.cli:main"

[project.urls]
Homepage = "https://github.com/zhoufanscut/VCharon"
Repository = "https://github.com/zhoufanscut/VCharon"
Issues = "https://github.com/zhoufanscut/VCharon/issues"
Changelog = "https://github.com/zhoufanscut/VCharon/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/vcharon"]
# guide/*.md and skill/SKILL.md ship because they sit under the package; importlib.resources
# reads them (in a binary too, where vcharon.spec collects them). No force-include: it would
# add those paths a second time.

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "docs/",
  "README.md",
  "DESIGN.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
  "vcharon.spec",
  "install.sh",
  "install.ps1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# ruff's default rules, minus these. Each is a design decision; say why when adding one.
ignore = [
  "UP031",   # %-formatting is the house style; the fix gives .format() and long lines
  "G010",    # false positive: vcharon.log.Log has warn(), no warning(); the fix breaks calls
  "ISC004",  # wrapped strings inside tuples and lists are the house style
]
# BLE001 stays on: each deliberate broad catch (cleanup that must not hide the first error, the
# top-level guard, plugin and wire boundaries) carries its own noqa, so a new one is flagged.

[tool.ruff.lint.isort]
# imports go stdlib, then vcharon, then the tests' own modules
known-local-folder = ["tests"]
