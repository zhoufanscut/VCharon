name: Release

# A tag v<version> builds the standalone binary on each platform, tests it, and publishes it
# (DESIGN, "Releases"). The tag must match both version strings: VERSION in
# src/vcharon/__init__.py and version in pyproject.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: "check the tag"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      # the pre-release test is --update's own (update.parse_version): what it ranks below the
      # final release, GitHub must not offer as the latest
      - name: Check the tag against both version strings and the CHANGELOG
        id: check
        env:
          PYTHONPATH: src
        run: |
          python - "$GITHUB_REF_NAME" <<'PYEOF'
          import datetime, os, re, sys, tomllib
          from vcharon import VERSION, update
          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]["version"]
          if not (version == VERSION == project):
              sys.exit("tag %s: the version is %r in src/vcharon/__init__.py and %r in "
                       "pyproject.toml; they must both be %r" % (tag, VERSION, project, version))
          parsed = update.parse_version(version)
          if parsed is None or not re.fullmatch(r"[0-9A-Za-z.]+", version):
              sys.exit("tag %s: %r isn't a version" % (tag, version))
          # the release's CHANGELOG entry, dated: "## <version> — YYYY-MM-DD" (an em dash)
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          heading = re.search(r"^## %s — (.*)$" % re.escape(version), changelog, re.M)
          if heading is None:
              sys.exit("tag %s: CHANGELOG.md has no heading '## %s — YYYY-MM-DD'"
                       % (tag, version))
          try:
              datetime.date.fromisoformat(heading.group(1).strip())
              dated = re.fullmatch(r"\d{4}-\d{2}-\d{2}", heading.group(1).strip())
          except ValueError:
              dated = None
          if not dated:
              sys.exit("tag %s: CHANGELOG.md's heading for %s is dated %r; give it the "
                       "release date, YYYY-MM-DD" % (tag, version, heading.group(1).strip()))
          prerelease = parsed[1][0] == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("version=%s\nprerelease=%s\n" % (version, str(prerelease).lower()))
          print("version %s, pre-release: %s" % (version, prerelease))
          PYEOF

  build:
    name: "build (${{ matrix.asset }})"
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # every row runs to its end: a failed release's failures are all seen in one run
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: vcharon-linux-x64
          - os: macos-latest
            asset: vcharon-darwin-arm64
          - os: windows-latest
            asset: vcharon-win-x64
    defaults:
      run:
        # the steps are POSIX sh; Git Bash on Windows
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      # every package the build installs, pip included, at an exact version and sha256 from
      # build-requirements.txt (DESIGN, "Releases"); then the package itself, which fetches
      # nothing: no dependencies, and its build backend comes from the lock. No ruff: the
      # release runs no lint
      - name: Install
        run: |
          python -m pip install --require-hashes -r build-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -t .

      # as ci.yml runs them on Windows: under pwsh (that runner's default shell), and with -v,
      # so a hang's log names the last test that started
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        run: pyinstaller --noconfirm vcharon.spec

      # Git Bash gets RUNNER_TEMP as D:\a\_temp; the scripts take a POSIX path
      - name: Scratch folder
        run: |
          work="$RUNNER_TEMP/release"
          if command -v cygpath > /dev/null 2>&1; then work="$(cygpath -u "$work")"; fi
          mkdir -p "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"

      # vcharon ping localhost runs the binary's helper on a real server
      - name: Start sshd, authorize a key for localhost
        if: runner.os == 'Linux'
        run: sh tests/ci_sshd.sh

      - name: Smoke test
        env:
          SMOKE_PING: ${{ runner.os == 'Linux' && 'localhost' || '' }}
        run: sh tests/smoke.sh dist "$WORK/smoke" "$VERSION"

      - name: Channel flow over ssh, with the binary
        if: runner.os == 'Linux'
        run: VCHARON="$PWD/dist/vcharon" sh tests/ssh_flow.sh localhost "$WORK/ssh-flow"

      - name: Pack
        run: python tests/pack.py dist "${{ matrix.asset }}" "$WORK/assets"

      # the checksum line as the system's own tool reads it
      - name: Check the checksum
        run: |
          cd "$WORK/assets"
          for sums in *.sha256; do
            if command -v sha256sum > /dev/null 2>&1; then
              sha256sum -c "$sums"
            else
              shasum -a 256 -c "$sums"
            fi
          done

      - name: Installer against a fake release
        run: |
          sh tests/install_check.sh "$WORK/assets" "${{ matrix.asset }}" "$VERSION" \
            "$WORK/install"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.asset }}
          # runner.temp: the OS's own form of the same folder, which the action needs on Windows
          path: ${{ runner.temp }}/release/assets/
          if-no-files-found: error
          retention-days: 7

  # one job makes the release, after every row: rows never race to create it
  publish:
    name: "publish"
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # for CHANGELOG.md, whose entry is the release notes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Check the nine assets
        working-directory: assets
        run: |
          ls -l
          want="vcharon-linux-x64 vcharon-linux-x64.tar.gz vcharon-linux-x64.tar.gz.sha256
            vcharon-darwin-arm64 vcharon-darwin-arm64.tar.gz vcharon-darwin-arm64.tar.gz.sha256
            vcharon-win-x64.exe vcharon-win-x64.zip vcharon-win-x64.zip.sha256"
          for name in $want; do
            [ -s "$name" ] || { echo "missing: $name" >&2; exit 1; }
          done
          [ "$(ls | wc -l)" -eq 9 ] || { echo "not exactly the nine assets" >&2; exit 1; }
          sha256sum -c ./*.sha256

      # the notes are the version's CHANGELOG entry, without its heading (the release's title
      # names the version), then where to install from and the full history
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'PYEOF'
          import os, re, sys
          version = sys.argv[1]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          entry = re.search(r"^## %s — [^\n]*\n(.*?)(?=^## |\Z)" % re.escape(version), changelog,
                            re.M | re.S)
          if entry is None or not entry.group(1).strip():
              sys.exit("CHANGELOG.md has no entry for %s" % version)
          repo = "https://github.com/%s" % os.environ["GITHUB_REPOSITORY"]
          print(entry.group(1).strip())
          print()
          print("Install: see the [README](%s#install). Full history: "
                "[CHANGELOG.md](%s/blob/main/CHANGELOG.md)." % (repo, repo))
          PYEOF
          cat "$RUNNER_TEMP/notes.md"

      # a pre-release (rc, a, b, dev) is never releases/latest, so --update and the installers
      # don't offer it
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "VCharon $VERSION" $flags \
            --notes-file "$RUNNER_TEMP/notes.md"
