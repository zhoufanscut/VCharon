name: CI

# A push or pull request that changes only the files below skips this workflow (it costs seven
# runner jobs); docs.yml runs the guards that read those files instead. A push with any other
# file runs everything. Keep this list and docs.yml's paths the same.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "unit (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the floor (3.13) and the newest Python, on each OS the binaries are built for
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        include:
          # its log then names the last test that started, if one hangs
          - os: windows-latest
            test-flags: "-v"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # a hang prints every thread's stack at 15 minutes (tests/__init__.py, when CI is set)
      - name: Run tests
        run: python -m unittest discover -s tests -t . ${{ matrix.test-flags }}

      # one row is enough: the result doesn't depend on the OS or Python (target-version is
      # fixed in pyproject.toml). After the tests, so a lint error never hides a test result.
      - name: Lint (ruff)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
        run: ruff check src tests

  # a real channel over real ssh, to the runner's own sshd: what the unit tests reach only
  # through a stand-in for ssh
  ssh:
    name: "ssh (ubuntu-latest, Python 3.13)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start sshd, authorize a key for localhost
        run: sh tests/ci_sshd.sh

      # two members from two VCHARON_HOMEs: create, join, ping, watch, post, sync, read, leave,
      # close
      - name: Channel flow over ssh
        run: sh tests/ssh_flow.sh localhost "$RUNNER_TEMP/ssh-flow"

      - name: Real-ssh unit tests
        env:
          VCHARON_TEST_SSH: localhost
        run: python -m unittest tests.test_real_ssh -v
